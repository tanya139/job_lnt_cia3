<!doctype html>
<html><head><meta charset="utf-8"><title>Recruiter Dashboard</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="/css/style.css"></head>
<body><nav id="main-nav" class="navbar navbar-expand-lg bg-white border-bottom"></nav><main class="container">
<section class="page-header"><h1>Recruiter Dashboard</h1><div class="alert-area"></div></section>
<h3>Company Profile</h3><form id="company-form" class="row g-2 mb-3"><input type="hidden" name="id"><div class="col-md-3"><input class="form-control" name="name" placeholder="Company name" required></div><div class="col-md-3"><input class="form-control" name="website" placeholder="Website"></div><div class="col-md-3"><input class="form-control" name="location" placeholder="Location"></div><div class="col-md-3"><input class="form-control" name="description" placeholder="Description"></div><div><button class="btn btn-primary">Save company</button></div></form><div id="companies" class="mb-4"></div>
<h3>My Jobs</h3><form id="job-form" class="row g-2 mb-3"><input type="hidden" name="id"><div class="col-md-3"><input class="form-control" name="title" placeholder="Job title" required></div><div class="col-md-3"><select class="form-select" name="companyId" required></select></div><div class="col-md-3"><input class="form-control" name="location" placeholder="Location" required></div><div class="col-md-3"><input class="form-control" name="experienceLevel" placeholder="Experience level" required></div><div class="col-md-4"><input class="form-control" name="skills" placeholder="Skills, comma separated"></div><div class="col-md-2"><input class="form-control" name="salaryMin" type="number" placeholder="Min salary"></div><div class="col-md-2"><input class="form-control" name="salaryMax" type="number" placeholder="Max salary"></div><div class="col-md-2"><select class="form-select" name="status"><option>Open</option><option>Closed</option></select></div><div class="col-md-12"><textarea class="form-control" name="description" placeholder="Description" required></textarea></div><div><button class="btn btn-primary">Save job</button><button type="button" id="cancel-job" class="btn btn-outline-secondary ms-2">Clear</button></div></form><div id="my-jobs" class="table-responsive mb-4"></div>
<h3>Applicants</h3><select id="stage-filter" class="form-select mb-3"><option value="">All stages</option><option>Applied</option><option>Shortlisted</option><option>Interview</option><option>Offered</option><option>Rejected</option><option>Hired</option></select><div class="table-responsive"><table class="table table-bordered bg-white"><thead><tr><th>Job</th><th>Candidate</th><th>Email</th><th>Current stage</th><th>Change stage</th></tr></thead><tbody id="applicants-table"></tbody></table></div>
<h3 class="mt-4">Schedule Interview</h3><form id="interview-form" class="row g-2 mb-4"><div class="col-md-4"><select class="form-select" name="applicationId" required></select></div><div class="col-md-3"><input class="form-control" name="scheduledAt" type="datetime-local" required></div><div class="col-md-2"><select class="form-select" name="mode"><option>Online</option><option>Offline</option></select></div><div class="col-md-3"><input class="form-control" name="meetingLink" placeholder="Meeting link (online)"></div><div class="col-md-12"><input class="form-control" name="feedback" placeholder="Feedback or notes"></div><div><button class="btn btn-primary">Schedule interview</button></div></form>
<h3>Create Offer</h3><form id="offer-form" class="row g-2 mb-3"><div class="col-md-4"><select class="form-select" name="applicationId" required></select></div><div class="col-md-3"><input class="form-control" name="salary" type="number" min="0" placeholder="Salary" required></div><div class="col-md-3"><input class="form-control" name="joiningDate" type="date" required></div><div class="col-md-2"><input class="form-control" name="offerLetterName" placeholder="Letter name"></div><div><button class="btn btn-primary">Create offer</button></div></form><div id="offers"></div>
</main><script src="/js/auth.js"></script><script src="/js/recruiter.js"></script></body></html>
