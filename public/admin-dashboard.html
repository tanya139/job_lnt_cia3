<!doctype html>
<html><head><meta charset="utf-8"><title>Admin Dashboard</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="/css/style.css"></head>
<body><nav id="main-nav" class="navbar navbar-expand-lg bg-white border-bottom"></nav><main class="container">
<section class="page-header"><h1>Admin Dashboard</h1><div class="alert-area"></div></section>
<h3>Users</h3><div class="table-responsive"><table class="table table-bordered bg-white"><thead><tr><th>Name</th><th>Email</th><th>Role</th></tr></thead><tbody id="users"></tbody></table></div>
<h3 class="mt-4">Companies</h3><div class="table-responsive"><table class="table table-bordered bg-white"><thead><tr><th>Name</th><th>Website</th><th>Location</th><th>Recruiter</th></tr></thead><tbody id="companies"></tbody></table></div>
<h3 class="mt-4">Jobs</h3><div class="table-responsive"><table class="table table-bordered bg-white"><thead><tr><th>Job</th><th>Company</th><th>Recruiter</th><th>Status</th></tr></thead><tbody id="jobs"></tbody></table></div>
<h3 class="mt-4">Applications</h3><div class="table-responsive"><table class="table table-bordered bg-white"><thead><tr><th>Job</th><th>Candidate</th><th>Recruiter</th><th>Stage</th></tr></thead><tbody id="applications"></tbody></table></div>
<h3 class="mt-4">Hiring Funnel</h3><table class="table table-bordered bg-white"><thead><tr><th>Stage</th><th>Count</th></tr></thead><tbody id="funnel"></tbody></table><h5>Conversion rates</h5><pre id="rates" class="bg-white p-3"></pre><h3>Jobs Report</h3><div id="jobs-report" class="bg-white p-3"></div>
</main><script src="/js/auth.js"></script><script src="/js/admin.js"></script></body></html>
