<!doctype html>
<html><head><meta charset="utf-8"><title>Candidate Dashboard</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="/css/style.css"></head>
<body><nav id="main-nav" class="navbar navbar-expand-lg bg-white border-bottom"></nav><main class="container">
<section class="page-header"><h1>Candidate Dashboard</h1><div class="alert-area"></div><p><a href="/profile.html">Manage profile</a> | <a href="/jobs.html">Search jobs</a></p></section>
<h3>My Applications</h3><div class="table-responsive"><table class="table table-bordered bg-white"><thead><tr><th>Job</th><th>Company</th><th>Stage</th><th>Applied</th></tr></thead><tbody id="applications-table"></tbody></table></div>
<h3 class="mt-4">Saved Jobs</h3><div id="saved-jobs" class="row g-3"></div>
<h3 class="mt-4">Job Alerts</h3><form id="alert-form" class="row g-2 mb-3"><div class="col-md-3"><input class="form-control" name="keyword" placeholder="Keyword"></div><div class="col-md-3"><input class="form-control" name="location" placeholder="Location"></div><div class="col-md-4"><input class="form-control" name="skills" placeholder="Skills, comma separated"></div><div class="col-md-2"><button class="btn btn-primary w-100">Create alert</button></div></form><div id="job-alerts"></div>
<h3 class="mt-4">My Interviews</h3><div id="interviews"></div>
<h3 class="mt-4">My Offers</h3><div id="offers"></div>
</main><script src="/js/auth.js"></script><script src="/js/candidate.js"></script></body></html>
