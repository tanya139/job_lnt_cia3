<!doctype html><html><head><meta charset="utf-8"><title>Register</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="/css/style.css"></head><body><nav id="main-nav" class="navbar navbar-expand-lg bg-white border-bottom"></nav><main class="container"><div class="row justify-content-center"><div class="col-md-6"><section class="page-header"><h1>Register</h1><div class="alert-area"></div><form id="register-form"><input class="form-control mb-3" name="name" placeholder="Full name" required><input class="form-control mb-3" name="email" type="email" placeholder="Email" required><input class="form-control mb-3" name="password" type="password" minlength="6" placeholder="Password" required><select class="form-select mb-3" name="role"><option>Candidate</option><option>Recruiter</option></select><button class="btn btn-primary">Create account</button></form></section></div></div></main><script src="/js/auth.js"></script><script>document.querySelector('#register-form').addEventListener('submit',async e=>{e.preventDefault();try{await api('/auth/register',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});location.href='/login.html';}catch(error){showMessage(error.message,'danger');}});</script></body></html>
