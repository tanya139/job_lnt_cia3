<!doctype html><html><head><meta charset="utf-8"><title>Login</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="/css/style.css"></head><body><nav id="main-nav" class="navbar navbar-expand-lg bg-white border-bottom"></nav><main class="container"><div class="row justify-content-center"><div class="col-md-6"><section class="page-header"><h1>Login</h1><div class="alert-area"></div><form id="login-form"><input class="form-control mb-3" name="email" type="email" placeholder="Email" required><input class="form-control mb-3" name="password" type="password" placeholder="Password" required><button class="btn btn-primary">Login</button></form></section></div></div></main><script src="/js/auth.js"></script><script>document.querySelector('#login-form').addEventListener('submit',async e=>{e.preventDefault();try{const result=await api('/auth/login',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});localStorage.setItem('token',result.data.token);localStorage.setItem('user',JSON.stringify(result.data.user));location.href='/' + result.data.user.role.toLowerCase() + '-dashboard.html';}catch(error){showMessage(error.message,'danger');}});</script></body></html>
