<!doctype html><html><head><meta charset="utf-8"><title>Candidate Profile</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="/css/style.css"></head><body><nav id="main-nav" class="navbar navbar-expand-lg bg-white border-bottom"></nav><main class="container"><div class="col-md-8"><section class="page-header"><h1>Candidate Profile</h1><div class="alert-area"></div><form id="profile-form"><input class="form-control mb-2" name="phone" placeholder="Phone"><input class="form-control mb-2" name="skills" placeholder="Skills, separated by commas"><input class="form-control mb-2" name="experienceYears" type="number" min="0" placeholder="Experience years"><input class="form-control mb-2" name="education" placeholder="Education"><textarea class="form-control mb-2" name="experienceSummary" placeholder="Experience summary"></textarea><input class="form-control mb-2" name="resumeName" placeholder="Resume file name"><textarea class="form-control mb-2" name="resumeSummary" placeholder="Resume summary"></textarea><button class="btn btn-primary">Save profile</button></form></section></div></main><script src="/js/auth.js"></script><script>document.addEventListener('DOMContentLoaded',async()=>{try{const r=await api('/candidates/profile');if(r.data){for(const [k,v] of Object.entries(r.data)){const el=document.querySelector(`[name="${k}"]`);if(el)el.value=Array.isArray(v)?v.join(', '):v;}}}catch(e){showMessage(e.message,'danger');}document.querySelector('#profile-form').addEventListener('submit',async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target));data.skills=data.skills?data.skills.split(',').map(x=>x.trim()):[];try{await api('/candidates/profile',{method:'PUT',body:JSON.stringify(data)});showMessage('Profile saved','success');}catch(error){showMessage(error.message,'danger');}});});</script></body></html>
